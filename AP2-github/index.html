<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AP2 · 三维层级场景：太阳系</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="glcanvas"></canvas>

  <div id="title">AP2 · 三维层级场景：太阳系</div>

  <div id="panel">
    <h2>参数面板</h2>

    <div class="row">
      <label>当前聚焦 <span id="focusName" class="val">太阳系全景</span></label>
    </div>

    <div class="row">
      <label>公转速度 <span id="orbitVal" class="val"></span></label>
      <input type="range" id="orbitSpeed" min="0" max="5" step="0.1" value="1">
    </div>

    <div class="row">
      <label>自转速度 <span id="spinVal" class="val"></span></label>
      <input type="range" id="spinSpeed" min="0" max="5" step="0.1" value="1">
    </div>

    <div class="row">
      <label>地球轴倾角 <span id="tiltVal" class="val"></span></label>
      <input type="range" id="tilt" min="0" max="45" step="0.5" value="23.5">
    </div>

    <div class="row checks">
      <label><input type="checkbox" id="showOrbits" checked> 轨道线</label>
      <label><input type="checkbox" id="showStars" checked> 星空</label>
      <label><input type="checkbox" id="showBelt" checked> 小行星带</label>
      <label><input type="checkbox" id="showRing" checked> 土星环</label>
    </div>

    <div class="row buttons">
      <button id="btnProj">投影：透视（O）</button>
      <button id="btnRoam">漫游：继续（空格）</button>
      <button id="btnReset">重置视角（R）</button>
    </div>

    <div id="hint">
      拖拽 = 轨迹球旋转 · 滚轮 = 缩放<br>
      单击行星 = 聚焦（拖拽 / 缩放围绕它） · 单击太阳或空白 = 回到全景<br>
      O = 切换 正交/透视 投影 · 空格 = 漫游 暂停/继续<br>
      漫游与拖拽视角可随时互相接管
    </div>
  </div>

  <script src="js/MV.js"></script>
  <script src="js/config.js"></script>
  <script src="js/shapes.js"></script>
  <script src="js/trackball.js"></script>
  <script src="js/textures-embedded.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
